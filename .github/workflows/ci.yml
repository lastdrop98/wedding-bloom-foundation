name: Solar Eclipse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Format source for CI validation
        run: bunx prettier --write "src/**/*.{ts,tsx,css}" "routes/**/*.{ts,tsx}" "components/**/*.{ts,tsx}" "lib/**/*.{ts,tsx}" "styles.css" "vite.config.ts"
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
