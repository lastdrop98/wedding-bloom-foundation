<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Solar Eclipse</title>
  <desc id="desc">Minimal eclipse mark in champagne gold on a deep charcoal background.</desc>
  <defs>
    <linearGradient id="gold" x1="84" y1="72" x2="430" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6E3B5"/>
      <stop offset=".45" stop-color="#D7B56D"/>
      <stop offset="1" stop-color="#A97A2C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#F5E5BE" stop-opacity=".16"/>
      <stop offset=".62" stop-color="#D4AF63" stop-opacity=".04"/>
      <stop offset="1" stop-color="#D4AF63" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#111111"/>
  <circle cx="256" cy="256" r="176" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="142" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-dasharray="760 132" transform="rotate(-38 256 256)"/>
  <circle cx="286" cy="226" r="106" fill="#111111" stroke="#F0D99F" stroke-opacity=".92" stroke-width="2"/>
  <circle cx="256" cy="256" r="82" fill="#151515"/>
  <circle cx="207" cy="173" r="6" fill="#F5E5BE" opacity=".9"/>
</svg>
